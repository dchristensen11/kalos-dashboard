// Days until a date, computed NOW. Never precomputed server-side: this page is

const daysUntil=d=>{
  if(!d) return null;
  const t=new Date(); t.setHours(0,0,0,0);
  const x=new Date(d+'T00:00:00');
  return Math.round((x-t)/86400000);

// clock runs out. A hard 24-hour window would drop anyone whose onboarding was
// unfinished by the next morning, silently and for good, which is the one failure
// this list exists to prevent. ONBOARD_TO caps it so it cannot become a graveyard.
const ONBOARD_NEW_H=24, ONBOARD_TO=3;   // Daniel's cap: past 3 days it is a miss
const onboardingDue=m=>{
  const o=m.onboarding; if(!o || !m.added) return null;
  const h=hoursSinceAdded(m); if(h==null || h<0) return null;
  // Hours decide FRESH, because "the last 24 hours" needs the minute. Everything
  // shown or capped counts CALENDAR days, the same midnight-to-midnight arithmetic
  // as every other date on this page: floor(hours/24) called a member added last
  // Tuesday evening "6 days ago" while the morning brief called them 7.
  const d=-daysUntil(m.added);
  if(d>ONBOARD_TO) return null;
  return {...o, hours:h, days:d, fresh:h<=ONBOARD_NEW_H};
};
const scanIn=m=>{
  const k=m.scan_next; if(!k) return null;
  const n=daysUntil(k.date);
  return (n!=null && n>=0 && n<=7) ? {...k, days:n} : null;
};
// Due the day before, and separately flagged on the day itself if it never ran:
// once the member is in the room the refresh cannot happen any more, so that is a
// miss to see rather than a task to do, and it does not belong in the filter.
const nightBeforeDue=m=>{
  const k=m.scan_next; if(!k || m.night_before_done) return null;
  const n=daysUntil(k.date);
  return n===1 ? {...k, days:n} : null;
};
const nightBeforeMissed=m=>{
  const k=m.scan_next; if(!k || m.night_before_done) return null;
  return daysUntil(k.date)===0 ? k : null;
};
// A duo is a property of the MEMBER, not of their next scan. The badge used to be
// rendered inside the scan block and only when the member was riding a partner's
// booking, so five of the ten duo members showed nothing at all on their card while
// the pairing sat in the data the whole time.
//
// It also compares the two programs. Duo partners usually buy the same thing, so a
// difference is either a deliberate split worth remembering or an attribution error
// worth fixing. Kat Sosa read as having no program at all until 30 Aug because a duo
// purchase had been booked entirely against Jayce Azua.
const duoOf=m=>{
  if(!m.duo) return null;
  const p=DATA.members.find(x=>x.slug===m.duo.slug);
  const mine=(m.program||{}).current||null, theirs=p?((p.program||{}).current||null):null;
  return {...m.duo, known:!!p, mine, theirs, mismatch: !!p && mine!==theirs};
};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const dd=(v,inv)=>v==null?'':`<span class="${(inv?-v:v)>0?'d-up':'d-dn'}">${v>0?'+':''}${v}</span>`;

function matches(m){
  if(q && !m.name.toLowerCase().includes(q)) return false;
  const day = m.program_day_calc;
  switch(filter){
    // Anyone who has not completed their 10-day call. The only exclusion is a
    // member for whom it does not apply: inherited from another coach, so they
    // are long past the window and no 10-day call was ever booked for them.
    case 'first10':  return !m.ten_day_done && !(!m.calls.ten_day &&
                       (m.days_since_start==null || m.days_since_start>30));
    case 'first4w':  return !m.past_first_scan;
    case 'longterm': return m.program.type==='package';
    case 'soon':     return (m.upcoming||[]).some(u=>u.days!=null&&u.days>=0&&u.days<=7);
    // computed server-side; excludes routine later package scans on purpose
    case 'scan7':    return scanIn(m)!=null;
    case 'prepdue':  {const s=scanIn(m); return s!=null && s.milestone && !m.prep_done;}
    case 'prepdue2': {const s=scanIn(m); return s!=null && !s.milestone && !m.prep_done;}
    case 'nightbefore': return nightBeforeDue(m)!=null;
    case 'followup': return followupDue(m)!=null;
    case 'onboarding': return onboardingDue(m)!=null;
    case 'flags':    return (m.flags||[]).length>0;
    default: return true;
  }
}

// Needs attention is a working list, not a browse list. Grouped by flag so one kind
// can be taken at a time, and so a bad RULE shows up as a bad rule: five members
// carrying the same wrong reason is one problem, not five, and that is only visible
// when they sit side by side. Every row carries the flag's own detail text, because
// the reason is the thing being judged, not the member.
//
// A member with three flags appears in three sections. That is deliberate.
function flagBoard(ms){
  const groups = new Map();
  ms.forEach(m => (m.flags||[]).forEach(f => {
    const g = groups.get(f.head) || {head:f.head, level:'orange', rows:[]};
    if(f.level==='red') g.level='red';
    g.rows.push({m:m, f:f});
    groups.set(f.head, g);
  }));
  const order = [...groups.values()].sort((a,b)=>
    a.level!==b.level ? (a.level==='red'?-1:1) : b.rows.length-a.rows.length);
  const total = order.reduce((n,g)=>n+g.rows.length,0);
  $('#app').innerHTML =
    `<div class="count">${total} flag${total===1?'':'s'} across ${ms.length} member${
      ms.length===1?'':'s'}, ${order.length} kind${order.length===1?'':'s'}
     · synced ${esc(DATA.generated)}</div>` +
    order.map(g=>`<section class="fgroup">
      <div class="fghead"><span class="fdot f-${g.level}"></span>
        <h3>${esc(g.head)}</h3><span class="fcount">${g.rows.length}</span></div>
      ${g.rows.sort((a,b)=>a.m.name.localeCompare(b.m.name)).map(r=>`
        <div class="frow" onclick="show('${r.m.slug}')">
          <div class="fname">${esc(r.m.name)}</div>
          <div class="freason">${esc(r.f.text||'')}</div>
        </div>`).join('')}
    </section>`).join('');
}

function list(){
  const ms = DATA.members.filter(matches).sort((a,b)=>a.name.localeCompare(b.name));
  if(filter==='flags') return flagBoard(ms);
  $('#app').innerHTML = `<div class="count">${ms.length} of ${DATA.members.length} members
    · synced ${esc(DATA.generated)}</div><div class="grid">` + ms.map(m=>{
    const nx=(m.upcoming||[])[0];
    return `<div class="card" onclick="show('${m.slug}')">
      <h3>${esc(m.name)}</h3>
      <div class="meta">
        <span class="badge b-${m.program.type}">${esc(m.program.current||'no program')}</span>
     ${m.goal?`<span class="badge b-goal-${esc(m.goal)}" title="${
        esc((m.path_reason||'')+'. Change it with the goal: line in the member record.')
     }">${{'fat-loss':'fat loss','recomp':'recomp','lbm-gain':'lean mass gain'}[m.goal]||esc(m.goal)
     }${m.path_source==='almi'?' <em style="font-style:normal;opacity:.6">auto</em>':''}</span>`
     :'<span class="badge b-goal-unset">path not set</span>'}
        ${(()=>{const d=duoOf(m); if(!d) return '';
           const s=scanIn(m);
           const riding = s&&s.ride ? `. Their booking, ${esc(d.name)} has no scan of their own that day` : '';
           const prog = d.mismatch ? `. PROGRAMS DIFFER: ${esc(d.mine||'none')} vs ${esc(d.theirs||'none')}` : '';
           return `<span class="badge ${d.mismatch?'b-duo-warn':'b-duo'}" title="Scans as a duo with ${
             esc(d.name)}${riding}. ${d.shared_scans.length} shared scan${
             d.shared_scans.length===1?'':'s'}, last ${esc(d.last_shared)}${prog}">duo · ${
             esc(d.name)}${d.mismatch?' · programs differ':''}</span>`;})()}
        ${(m.flags||[]).length?`<span class="badge b-flag">${m.flags.length} flag${m.flags.length>1?'s':''}</span>`:''}
        ${(()=>{const s=scanIn(m); if(!s) return '';
           const prep = m.prep_done ? '' : ` <span class="badge b-prep" title="${esc(s.kind)} · ${s.milestone?'milestone':'routine'} prep">prep due</span>`;
           return `<span class="badge b-scan" title="${esc(s.kind)} on ${esc(s.date)}, ${esc(s.moment)}${s.ride?`, scanning as a duo with ${esc(s.ride)}`:''}">${
             s.days===0?'scan today':s.days===1?'scan tomorrow':`scan in ${s.days}d`}</span>`+prep;})()}
        ${nightBeforeDue(m)?`<span class="badge b-night" title="modal refresh for tomorrow's scan">night-before due</span>`:''}
        ${nightBeforeMissed(m)?`<span class="badge b-night-miss" title="scanning today and the night-before refresh never ran">no night-before</span>`:''}
        ${(()=>{const f=followupDue(m); if(!f) return '';
           return `<span class="badge b-followup" title="${esc(f.kind)} on ${esc(f.date)}">follow-up ${f.age}d</span>`;})()}
        ${(()=>{const o=onboardingDue(m); if(!o) return '';
           const when = o.days===0?'Added today':o.days===1?'Added yesterday':`Added ${o.days} days ago`;
           const fresh = o.fresh ? ', inside the last 24 hours' : '';
           return `<span class="badge b-new" title="${when} (${esc(m.added)})${fresh}. Still open: ${
             esc(o.labels.join(', '))}">onboarding · ${o.missing.length} left</span>`;})()}
      </div>
      <div class="meta" style="margin-top:6px">
        ${m.body?`${m.body.total_lb} lb · ${m.body.bf_pct}% fat`:'no scan on file'}
        ${nx?` · next ${esc(nx.type)} in ${nx.days}d`:''}
      </div></div>`;
  }).join('') + '</div>';
}

function show(slug){
  const m = DATA.members.find(x=>x.slug===slug); if(!m) return;
  current=slug;
  const b=m.body, d=m.body_delta, ctx=m.context||{};
  // Every number carries its change since baseline underneath it. Baseline is the
  // 4-week-baseline scan when there is one (delayed starts), else the intro scan.
  // inv=true means down is good, so fat loss reads green.
  const stat=(v,l,dv,inv,tracked)=>`<div><b>${v==null?'—':v}</b><span>${l}</span>${
    !tracked ? ''
      : dv==null ? `<em class="nod">${(m.scan_history||[]).length<2?'first scan':'no baseline'}</em>`
                 : `<em>${dd(dv,inv)} since baseline</em>`}</div>`;
  $('#app').innerHTML = `
   <div class="back" onclick="current=null;list()">← all members</div>
   <h2 style="font-size:25px;margin:9px 0 3px;letter-spacing:-.02em">${esc(m.name)}${
     m.ids&&m.ids.everfit?` <a class="eflink" target="_blank" rel="noopener"
       title="Open ${esc(m.name)} in the Kalos app"
       href="https://app.everfit.io/home/client/${esc(m.ids.everfit)}">Kalos app &#8599;</a>`:''}</h2>
   <div class="meta">
     <span class="badge b-${m.program.type}">${esc(m.program.current||'no program')}</span>
     ${m.goal?`<span class="badge b-goal-${esc(m.goal)}" title="${
        esc((m.path_reason||'')+'. Change it with the goal: line in the member record.')
     }">${{'fat-loss':'fat loss','recomp':'recomp','lbm-gain':'lean mass gain'}[m.goal]||esc(m.goal)
     }${m.path_source==='almi'?' <em style="font-style:normal;opacity:.6">auto</em>':''}</span>`
     :'<span class="badge b-goal-unset">path not set</span>'}
     ${m.stage&&m.stage!==m.program.type?`<span class="badge">${esc(m.stage)}</span>`:''}
     ${m.age?`<span class="badge">${m.age} yrs</span>`:''}
     started ${esc(m.program.start||'unknown')}
     ${m.program.term_end?` · term ends ${esc(m.program.term_end)}`:''}
   </div>
   <div class="stat">
     ${stat(b?b.total_lb:null,'weight lb',    d?d.total_lb:null, 1, 1)}
     ${stat(b?b.lean_lb:null,'lean lb',       d?d.lean_lb:null,  0, 1)}
     ${stat(b?b.fat_lb:null,'fat lb',         d?d.fat_lb:null,   1, 1)}
     ${stat(b?b.bf_pct:null,'body fat %',     d?d.bf_pct:null,   1, 1)}
     ${stat(b?b.vat_area_cm2:null,'visceral cm²', d?d.vat_area_cm2:null, 1, 1)}
     ${stat(m.almi_pct==null?null:m.almi_pct+'%','ALMI percentile')}
     ${stat(m.scale_weight_lb,'scale weight lb')}
     ${stat(m.age,'age')}
   </div>
   <div class="meta">Numbers read off the DEXA report PDF${m.number_source==='regional'?
     ' <span class="flag">(regional fallback, PDF not read yet)</span>':''}${
     m.baseline_date?` · baseline is the ${esc(m.baseline_label)} on ${esc(m.baseline_date)}${
       m.baseline_span?`, ${m.baseline_span} days ago`:''}${
       m.baseline_inferred?' <span class="pend">(taken from the scan record, no intro-scan booking)</span>':''}`
       :' · no scan on record yet'}.</div>

   ${m.duo?`<div class="meta" style="margin:6px 0 2px">Scans as a duo with
     <a href="#" class="duolink" onclick="event.preventDefault();show('${m.duo.slug}')">${esc(m.duo.name)}</a>
     · ${m.duo.shared_scans.length} shared scan${m.duo.shared_scans.length>1?'s':''}, last ${esc(m.duo.last_shared)}
     · book and prep them together</div>`:''}

   <section><h2>4-Week Mission Critical SOP</h2>
     ${(()=>{const S=m.sop||{items:{}}, it=S.items||{}, en=m.enrolment||{};
       const pkg=m.program.type==='package';
       const ONB=[['program-assigned','Program assigned'],['goal-set','Goal set'],
         ['protein-strategy','Protein goal and strategy sent'],
         ['nutrition-strategy','Pre/post workout nutrition strategy'],
         ['gut-health-form','Gut Health form'],['neurotyping-form','Neurotyping form'],
         ['visceral-strategy','Visceral fat strategy (if relevant)'],
         ['vip-assigned','VIP membership assigned']];
       const MC=[['intro-scan','Intro DEXA scan'],['baseline-scan','4-week baseline scan'],
         ['onboarding-call','Onboarding call'],['first-week','First-week check-in'],
         ['ten-day-call','10-day call'],['ten-day-followup','10-day follow-up'],
         ['week-out','Week out, scan prep'],['second-scan','Second or first package scan'],
         ['outcome','Outcome recorded']];
       const LT=[['in-person-assessment','In-person form assessment']];
       // the live enrolment detail rides along with its own SOP line rather than
       // sitting in a separate section repeating the same two facts
       const extraFor=k=>{
         if(k==='vip-assigned'){
           const b=[]; if(en.vip_status) b.push(esc(en.vip_status));
           if(en.vip_enrolled_at) b.push(`since ${esc(en.vip_enrolled_at)}`);
           if(en.vip_course===false) b.push('not enrolled');
           return b.length?` <span class="meta">· ${b.join(' · ')}</span>`:'';
         }
         return '';
       };
       const col=(title,rows)=>{
         const vis=rows.filter(([k])=>!(k==='vip-assigned'&&!pkg)
                                    &&!(k==='baseline-scan'&&!m.scans.four_week_baseline));
         const done=vis.filter(([k])=>(it[k]||{}).done).length;
         return `<div class="sopcol"><div class="sopg"><b>${title}</b>
           <span class="meta">${done}/${vis.length}</span></div><ul class="sop">`+
           vis.map(([k,lab])=>{const st=it[k]||{};
             const on=st.on?` <span class="meta">· ${esc(st.on)}</span>`:'';
             return `<li class="${st.done?'sd':'sp'}"><i>${st.done?'✓':'○'}</i>${esc(lab)}${on}${extraFor(k)}</li>`;
           }).join('')+`</ul></div>`;
       };
       let html=`<div class="meta" style="margin-bottom:9px">Goal: <b>${
          m.goal?esc(m.goal):'<span class="pend">not set</span>'}</b> · ticked in the member
          record, not inferred from Iris</div><div class="sopwrap">`;
       html+=col('Onboarding',ONB)+col('Mission critical',MC)+`</div>`;
       if(pkg) html+=`<div class="sopwrap">`+col('Long-term track',LT)+`<div class="sopcol"></div></div>`;
       if((S.extra||[]).length) html+=`<div class="sopg"><b>Also</b></div><ul class="sop">`+
         S.extra.map(x=>`<li class="sd"><i>✓</i>${esc(x.replace(/^[-\s]*\[[ xX]\]\s*/,''))}</li>`).join('')+`</ul>`;
       return html;})()}
   </section>

   <section><h2>Training adherence</h2><div class="box">
     ${(()=>{const a=m.adherence;
       if(!a) return `<span class="pend">No training data on record.</span>`;
       if(a.kind==='untracked') return `<span class="pend">Not tracked. ${esc(a.detail||'')}</span>`;
       if(a.kind==='too-new') return `<span class="pend">Just onboarded (${esc(a.detail||'')}). No program assigned yet.</span>`;
       const S=a.series||[];
       const rows=S.length?`<div class="wks">`+S.slice().reverse().map(w=>{
          const p=w.pct==null?0:w.pct;
          const cls=p>=80?'wf-ok':(p>=50?'wf-mid':'wf-bad');
          const d=new Date(w.w+'T00:00:00');
          const lab=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
          return `<div class="wk"><span class="wkl">${lab}</span>
            <span class="wkt">${w.c}/${w.s}</span>
            <span class="wkbar"><i class="${cls}" style="width:${Math.max(p,2)}%"></i></span>
            <span class="wkp">${p}%</span></div>`;
        }).join('')+`</div>`:'';
       const tot=S.reduce((x,w)=>x+w.s,0), got=S.reduce((x,w)=>x+w.c,0);
       const bits=[
         tot?`<b>${got} of ${tot}</b> sessions over ${S.length} week${S.length===1?'':'s'}`:null,
         a.recent_pct!=null&&a.baseline_pct!=null?`<b>${a.recent_pct}%</b> recent vs <b>${a.baseline_pct}%</b> before`:null,
         a.days_since_completed!=null?`last session ${a.days_since_completed}d ago`:null,
         a.missed?`<b>${a.missed}</b> missed in a row`:null,
       ].filter(Boolean).join(' · ');
       const note=a.kind==='paused'?`<div class="pend">Paused. ${esc(a.detail||'')}</div>`
                 :a.kind==='just-back'?`<div class="pend">Just back from a pause, restarting.</div>`
                 :a.kind==='recovered'?`<div class="pend">${esc(a.detail||'')}</div>`:'';
       return `<div class="meta" style="margin-bottom:9px">${bits}</div>`+rows+note;
     })()}
   </div></section>





   ${(m.wins||[]).length?`<section><h2>Wins</h2><div class="box">
     <ul>${m.wins.map(w=>`<li class="win">${esc(w.text)}</li>`).join('')}</ul></div></section>`:''}

   ${(m.flags||[]).length?`<section><h2>Needs attention</h2><div class="box">
     ${m.flags.map(f=>`<div class="fl fl-${f.level}">
        <b>${esc(f.head)}</b>${esc(f.text)}</div>`).join('')}</div></section>`:''}

   <section><h2>Why and goals</h2><div class="box why">
     ${(()=>{const w=m.why_strength; if(!w) return '';
       const cls={missing:'b-why-bad',thin:'b-why-bad',anchored:'b-why-ok'}[w.band]||'';
       return `<div class="meta" style="margin-bottom:8px">
         <span class="badge ${cls}">${esc(w.band)}</span>
         ${w.anchors.length?esc(w.anchors.join(', ')):'no anchor we could name back to them'}
         · <b>${w.insights}</b> transcript insight${w.insights===1?'':'s'} to mine</div>`;})()}
     ${Object.keys(m.why||{}).length?Object.entries(m.why).map(([k,v])=>
        `<p><b>${k==='underlyingMotivation'?'Why':'Goals'}.</b> ${esc(v)}</p>`).join('')
        : '<span class="pend">Not captured yet.</span>'}
   </div></section>

   ${(m.coach_context||[]).length?`<section><h2>Coaching context</h2><div class="box">
     ${m.coach_context.map(c=>`<div class="ctx">
        <span class="ic">${c.icon}</span>
        <span><span class="lb">${esc(c.label)}</span><br>${esc(c.text)}</span></div>`).join('')}
   </div></section>`:''}



   <section><h2>Upcoming</h2><div class="box">
     ${(m.upcoming||[]).length?`<ul>${m.upcoming.map(u=>
        `<li>${esc(u.date)} · ${esc(u.type)} <span class="meta">(in ${u.days} days)</span></li>`).join('')}</ul>`
       :'<span class="pend">Nothing booked.</span>'}
   </div></section>



   ${(m.admin||[]).length?`<section><h2>Admin</h2><div class="box">
     <details><summary>${m.admin.length} bookkeeping item${m.admin.length>1?'s':''}, not coaching flags</summary>
     <ul class="adm" style="margin-top:8px">${m.admin.map(a=>`<li>${esc(a.text)}</li>`).join('')}</ul>
     </details></div></section>`:''}

   ${(m.scan_history||[]).length>1?`<section><h2>Scan history</h2><div class="box">
     <ul class="tl">${m.scan_history.map(s=>`<li><span class="dt">${esc(s.date)}</span>
       <span style="flex:1">${[s.total_lb!=null?s.total_lb+' lb':null, s.lean_lb!=null?s.lean_lb+' lean':null,
         s.fat_lb!=null?s.fat_lb+' fat':null, s.bf_pct!=null?s.bf_pct+'%':null,
         s.vat_g!=null?'VAT '+s.vat_g+'g':null].filter(Boolean).join(' · ')}</span>
       </li>`).join('')}</ul></div></section>`:''}
  `;
  window.scrollTo(0,0);
}

// The rail sticks below the header, so its offset has to be the header's REAL
// height rather than a guess: the header grows when the search row wraps.
const setHdr=()=>document.documentElement.style.setProperty(
  '--hdr', document.querySelector('header').offsetHeight+'px');
setHdr(); addEventListener('resize', setHdr);
$('#chips').innerHTML = FILTERS.map(([k,l])=>
  `<span class="chip${k==='all'?' on':''}" data-f="${k}"${
    FILTER_HELP[k]?` title="${esc(FILTER_HELP[k])}"`:''}>${l}</span>`).join('');
$('#chips').onclick = e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  current=null; list();
};
$('#q').oninput = e=>{
  q=e.target.value.trim().toLowerCase();
  const hits=DATA.members.filter(matches);
  if(q && hits.length===1){ show(hits[0].slug); } else { current=null; list(); }
};
list();
</script>
