<!doctype html>
<meta charset="utf-8"><title>Kalos Members</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#252a34;--tx:#e7e9ee;--dim:#9aa3b2;
--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#4c8dff;--soft:#1d222b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);
font:15px/1.55 ui-sans-serif,-apple-system,"SF Pro Text",Segoe UI,Roboto,sans-serif}
header{position:sticky;top:0;z-index:9;background:rgba(15,17,21,.94);
backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 22px}
.hrow{max-width:1180px;margin:0 auto;display:flex;gap:14px;align-items:center}
.chips{display:flex;gap:7px;flex-wrap:wrap;justify-content:center;
max-width:1180px;margin:11px auto 0}
h1{font-size:15px;margin:0;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
#q{flex:1;min-width:220px;background:var(--panel);border:1px solid var(--line);color:var(--tx);
padding:9px 13px;border-radius:8px;font-size:15px;outline:none}
#q:focus{border-color:var(--acc)}
.navlink{flex:none;padding:9px 14px;border:1px solid var(--line);border-radius:8px;
background:var(--panel);color:var(--dim);text-decoration:none;font-size:13.5px;white-space:nowrap}
.navlink:hover{border-color:var(--acc);color:var(--tx)}
.chip{padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:var(--panel);
color:var(--dim);cursor:pointer;font-size:13px;user-select:none}
.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
main{padding:22px;max-width:1180px;margin:0 auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:11px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;cursor:pointer}
.card:hover{border-color:var(--acc)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:600}
.meta{color:var(--dim);font-size:12.5px}
.badge{display:inline-block;padding:1px 8px;border-radius:999px;font-size:11px;
border:1px solid var(--line);color:var(--dim);margin-right:5px}
.b-entry{color:#8ab4ff;border-color:#2a4a80}.b-package{color:#9ad8a0;border-color:#2c5233}
.b-unknown{color:var(--warn);border-color:#5c4a1a}
.b-flag{color:var(--bad);border-color:#6b2b28}
.b-duo{color:#c9a0ff;border-color:#4a3a6b}
.b-scan{color:#ffd479;border-color:#6b5a28;font-weight:600}
a.duolink{color:var(--acc);text-decoration:none}a.duolink:hover{text-decoration:underline}
.stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(112px,1fr));gap:9px;margin:14px 0}
.stat div{background:var(--soft);border:1px solid var(--line);border-radius:9px;padding:10px 12px}
.stat b{display:block;font-size:20px;font-weight:600;letter-spacing:-.01em}
.stat span{color:var(--dim);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em}
.stat em{display:block;font-style:normal;font-size:11.5px;margin-top:3px}
.stat em.nod{color:#5c6472}
.d-up{color:var(--ok)}.d-dn{color:var(--bad)}
.wk{display:flex;gap:6px;align-items:flex-end}
.wkc{flex:1;text-align:center;min-width:26px}
.wkc>span{display:block;font-size:10.5px;color:var(--dim);margin-top:4px}
.wkb{height:46px;background:var(--soft);border:1px solid var(--line);border-radius:4px;
display:flex;align-items:flex-end;overflow:hidden}
.wkb i{display:block;width:100%}
.w-ok{background:var(--ok)}.w-mid{background:var(--warn)}.w-bad{background:var(--bad)}
section{margin:22px 0}
section h2{font-size:12px;text-transform:uppercase;letter-spacing:.13em;color:var(--dim);
margin:0 0 9px;font-weight:600}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
ul{margin:0;padding-left:19px}li{margin:3px 0}
.tl{list-style:none;padding:0;margin:0}
.tl li{display:flex;gap:11px;padding:7px 0;border-bottom:1px solid var(--line);align-items:baseline}
.tl li:last-child{border:0}
.tl .dt{color:var(--dim);font-size:12.5px;min-width:92px;font-variant-numeric:tabular-nums}
.tl .st{font-size:11px;padding:1px 8px;border-radius:999px;border:1px solid}
.s-done{color:var(--ok);border-color:#245c2c}.s-booked{color:var(--acc);border-color:#2a4a80}
.s-open{color:var(--warn);border-color:#5c4a1a}.s-overdue{color:var(--bad);border-color:#6b2b28}
.win{color:var(--ok)}.flag{color:var(--bad)}
.fl{border-left:3px solid var(--line);padding:8px 0 8px 12px;margin:9px 0}
.fl b{display:block;margin-bottom:2px}
.fl-red{border-color:var(--bad)} .fl-red b{color:var(--bad)}
.fl-orange{border-color:var(--warn)} .fl-orange b{color:var(--warn)}
.ctx{display:flex;gap:11px;padding:9px 0;border-bottom:1px solid var(--line)}
.ctx:last-child{border:0}
.ctx .ic{font-size:17px;line-height:1.3;min-width:22px}
.ctx .lb{color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:.08em}
.s-pending{color:#5a6472;border-color:#2a3038}
.s-missed{color:#8a6a6a;border-color:#4a3436}
.s-unconfirmed{color:var(--warn);border-color:#5c4a1a}
.sopg{margin:11px 0 4px;font-size:12.5px}
ul.sop{list-style:none;padding:0;margin:0}
ul.sop li{padding:2px 0;font-size:13.5px}
ul.sop li.sd{color:var(--tx)} ul.sop li.sp{color:var(--dim)}
ul.sop li{display:flex;gap:7px;align-items:baseline}
ul.sop li i{font-style:normal;flex:none;width:12px}
ul.sop li.sd i{color:var(--ok)} ul.sop li.sp i{color:#4a515e}
.sopwrap{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media(max-width:720px){.sopwrap{grid-template-columns:1fr}}
.sopcol{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.wkrow{display:flex;flex-wrap:wrap;gap:9px;align-items:center}
.wkgrp{display:inline-flex;gap:3px;padding:3px 5px;border-radius:6px;background:var(--soft);
border:1px solid var(--line)}
.wkgrp i{width:9px;height:9px;border-radius:50%;display:block}
.wkgrp i.dn{background:var(--ok)}
.wkgrp i.dm{background:transparent;border:1px solid var(--bad)}
.b-goal-fat-loss{color:#ffb26b;border-color:#6b4a28}
.b-goal-recomp{color:#8ab4ff;border-color:#2a4a80}
.b-goal-lbm-gain{color:#9ad8a0;border-color:#2c5233}
.b-goal-unset{color:#5c6472;border-color:#333a45}
.b-why-ok{color:var(--ok);border-color:#245c2c}
.wks{display:flex;flex-direction:column;gap:5px}
.wk{display:flex;align-items:center;gap:10px;font-size:13px}
.wkl{width:52px;color:var(--dim);flex:none}
.wkt{width:34px;flex:none;color:var(--tx)}
.wkbar{flex:1;height:7px;background:var(--soft);border-radius:99px;overflow:hidden;
border:1px solid var(--line)}
.wkbar i{display:block;height:100%;border-radius:99px}
.wkp{width:38px;text-align:right;flex:none;color:var(--dim)}
.wf-ok{background:var(--ok)}.wf-mid{background:var(--warn)}.wf-bad{background:var(--bad)}
.b-why-bad{color:var(--bad);border-color:#6b2b28}
a.eflink{font-size:12.5px;font-weight:500;letter-spacing:0;vertical-align:middle;
margin-left:9px;padding:3px 9px;border:1px solid var(--line);border-radius:999px;
color:var(--dim);text-decoration:none;white-space:nowrap}
a.eflink:hover{border-color:var(--acc);color:var(--tx)}
.tl li.pend{opacity:.45}
.adm{color:var(--dim);font-size:12.5px}
details summary{cursor:pointer;color:var(--dim);font-size:12.5px;outline:none}
.back{color:var(--acc);cursor:pointer;font-size:13.5px}
.why p{margin:6px 0}.why b{color:#c9d3e3}
.pend{color:var(--dim);font-style:italic;font-size:13px}
.count{color:var(--dim);font-size:13px;margin-bottom:11px}
@media(max-width:640px){main{padding:14px}header{padding:11px 14px}}
</style>

  if(!d) return null;

  // 4-week-baseline scan when there is one (delayed starts), else the intro scan.
  // inv=true means down is good, so fat loss reads green.
  const stat=(v,l,dv,inv,tracked)=>`<div><b>${v==null?'—':v}</b><span>${l}</span>${
    !tracked ? ''
      : dv==null ? `<em class="nod">${(m.scan_history||[]).length<2?'first scan':'no baseline'}</em>`
                 : `<em>${dd(dv,inv)} since baseline</em>`}</div>`;
  $('#app').innerHTML = `
   <div class="back" onclick="current=null;list()">← all members</div>
   <h2 style="font-size:25px;margin:9px 0 3px;letter-spacing:-.02em">${esc(m.name)}${
     m.ids&&m.ids.everfit?` <a class="eflink" target="_blank" rel="noopener"
       title="Open ${esc(m.name)} in the Kalos app"
       href="https://app.everfit.io/home/client/${esc(m.ids.everfit)}">Kalos app &#8599;</a>`:''}</h2>
   <div class="meta">
     <span class="badge b-${m.program.type}">${esc(m.program.current||'no program')}</span>
     ${m.goal?`<span class="badge b-goal-${esc(m.goal)}" title="${
        esc((m.path_reason||'')+'. Change it with the goal: line in the member record.')
     }">${{'fat-loss':'fat loss','recomp':'recomp','lbm-gain':'lean mass gain'}[m.goal]||esc(m.goal)
     }${m.path_source==='almi'?' <em style="font-style:normal;opacity:.6">auto</em>':''}</span>`
     :'<span class="badge b-goal-unset">path not set</span>'}
     ${m.stage&&m.stage!==m.program.type?`<span class="badge">${esc(m.stage)}</span>`:''}
     ${m.age?`<span class="badge">${m.age} yrs</span>`:''}
     started ${esc(m.program.start||'unknown')}
     ${m.program.term_end?` · term ends ${esc(m.program.term_end)}`:''}
   </div>
   <div class="stat">
     ${stat(b?b.total_lb:null,'weight lb',    d?d.total_lb:null, 1, 1)}
     ${stat(b?b.lean_lb:null,'lean lb',       d?d.lean_lb:null,  0, 1)}
     ${stat(b?b.fat_lb:null,'fat lb',         d?d.fat_lb:null,   1, 1)}
     ${stat(b?b.bf_pct:null,'body fat %',     d?d.bf_pct:null,   1, 1)}
     ${stat(b?b.vat_area_cm2:null,'visceral cm²', d?d.vat_area_cm2:null, 1, 1)}
     ${stat(m.almi_pct==null?null:m.almi_pct+'%','ALMI percentile')}
     ${stat(m.scale_weight_lb,'scale weight lb')}
     ${stat(m.age,'age')}
   </div>
   <div class="meta">Numbers read off the DEXA report PDF${m.number_source==='regional'?
     ' <span class="flag">(regional fallback, PDF not read yet)</span>':''}${
     m.baseline_date?` · baseline is the ${esc(m.baseline_label)} on ${esc(m.baseline_date)}${
       m.baseline_span?`, ${m.baseline_span} days ago`:''}${
       m.baseline_inferred?' <span class="pend">(taken from the scan record, no intro-scan booking)</span>':''}`
       :' · no scan on record yet'}.</div>

   ${m.duo?`<div class="meta" style="margin:6px 0 2px">Scans as a duo with
     <a href="#" class="duolink" onclick="event.preventDefault();show('${m.duo.slug}')">${esc(m.duo.name)}</a>
     · ${m.duo.shared_scans.length} shared scan${m.duo.shared_scans.length>1?'s':''}, last ${esc(m.duo.last_shared)}
     · book and prep them together</div>`:''}

   <section><h2>4-Week Mission Critical SOP</h2>
     ${(()=>{const S=m.sop||{items:{}}, it=S.items||{}, en=m.enrolment||{};
       const pkg=m.program.type==='package';
       const ONB=[['program-assigned','Program assigned'],['goal-set','Goal set'],
         ['protein-strategy','Protein goal and strategy sent'],
         ['nutrition-strategy','Pre/post workout nutrition strategy'],
         ['gut-health-form','Gut Health form'],['neurotyping-form','Neurotyping form'],
         ['visceral-strategy','Visceral fat strategy (if relevant)'],
         ['drip-assigned','4-week drip assigned'],['vip-assigned','VIP membership assigned']];
       const MC=[['intro-scan','Intro DEXA scan'],['baseline-scan','4-week baseline scan'],
         ['onboarding-call','Onboarding call'],['first-week','First-week check-in'],
         ['ten-day-call','10-day call'],['ten-day-followup','10-day follow-up'],
         ['week-out','Week out, scan prep'],['second-scan','Second or first package scan'],
         ['outcome','Outcome recorded']];
       const LT=[['in-person-assessment','In-person form assessment']];
       // the live enrolment detail rides along with its own SOP line rather than
       // sitting in a separate section repeating the same two facts
       const extraFor=k=>{
         if(k==='drip-assigned'){
           const b=[]; if(m.drip_sent!=null) b.push(`${m.drip_sent} of 9 sent`);
           if(en.drip_start) b.push(`started ${esc(en.drip_start)}`);
           if(en.drip===false) b.push('not enrolled');
           return b.length?` <span class="meta">· ${b.join(' · ')}</span>`:'';
         }
         if(k==='vip-assigned'){
           const b=[]; if(en.vip_status) b.push(esc(en.vip_status));
           if(en.vip_enrolled_at) b.push(`since ${esc(en.vip_enrolled_at)}`);
           if(en.vip_course===false) b.push('not enrolled');
           return b.length?` <span class="meta">· ${b.join(' · ')}</span>`:'';
         }
         return '';
       };
       const col=(title,rows)=>{
         const vis=rows.filter(([k])=>!(k==='vip-assigned'&&!pkg)
                                    &&!(k==='baseline-scan'&&!m.scans.four_week_baseline));
         const done=vis.filter(([k])=>(it[k]||{}).done).length;
         return `<div class="sopcol"><div class="sopg"><b>${title}</b>
           <span class="meta">${done}/${vis.length}</span></div><ul class="sop">`+
           vis.map(([k,lab])=>{const st=it[k]||{};
             const on=st.on?` <span class="meta">· ${esc(st.on)}</span>`:'';
             return `<li class="${st.done?'sd':'sp'}"><i>${st.done?'✓':'○'}</i>${esc(lab)}${on}${extraFor(k)}</li>`;
           }).join('')+`</ul></div>`;
       };
       let html=`<div class="meta" style="margin-bottom:9px">Goal: <b>${
          m.goal?esc(m.goal):'<span class="pend">not set</span>'}</b> · ticked in the member
          record, not inferred from Iris</div><div class="sopwrap">`;
       html+=col('Onboarding',ONB)+col('Mission critical',MC)+`</div>`;
       if(pkg) html+=`<div class="sopwrap">`+col('Long-term track',LT)+`<div class="sopcol"></div></div>`;
       if((S.extra||[]).length) html+=`<div class="sopg"><b>Also</b></div><ul class="sop">`+
         S.extra.map(x=>`<li class="sd"><i>✓</i>${esc(x.replace(/^[-\s]*\[[ xX]\]\s*/,''))}</li>`).join('')+`</ul>`;
       return html;})()}
   </section>

   <section><h2>Training adherence</h2><div class="box">
     ${(()=>{const a=m.adherence;
       if(!a) return `<span class="pend">No training data on record.</span>`;
       if(a.kind==='untracked') return `<span class="pend">Not tracked. ${esc(a.detail||'')}</span>`;
       if(a.kind==='too-new') return `<span class="pend">Just onboarded (${esc(a.detail||'')}). No program assigned yet.</span>`;
       const S=a.series||[];
       const rows=S.length?`<div class="wks">`+S.slice().reverse().map(w=>{
          const p=w.pct==null?0:w.pct;
          const cls=p>=80?'wf-ok':(p>=50?'wf-mid':'wf-bad');
          const d=new Date(w.w+'T00:00:00');
          const lab=d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
          return `<div class="wk"><span class="wkl">${lab}</span>
            <span class="wkt">${w.c}/${w.s}</span>
            <span class="wkbar"><i class="${cls}" style="width:${Math.max(p,2)}%"></i></span>
            <span class="wkp">${p}%</span></div>`;
        }).join('')+`</div>`:'';
       const tot=S.reduce((x,w)=>x+w.s,0), got=S.reduce((x,w)=>x+w.c,0);
       const bits=[
         tot?`<b>${got} of ${tot}</b> sessions over ${S.length} week${S.length===1?'':'s'}`:null,
         a.recent_pct!=null&&a.baseline_pct!=null?`<b>${a.recent_pct}%</b> recent vs <b>${a.baseline_pct}%</b> before`:null,
         a.days_since_completed!=null?`last session ${a.days_since_completed}d ago`:null,
         a.missed?`<b>${a.missed}</b> missed in a row`:null,
       ].filter(Boolean).join(' · ');
       const note=a.kind==='paused'?`<div class="pend">Paused. ${esc(a.detail||'')}</div>`
                 :a.kind==='just-back'?`<div class="pend">Just back from a pause, restarting.</div>`
                 :a.kind==='recovered'?`<div class="pend">${esc(a.detail||'')}</div>`:'';
       return `<div class="meta" style="margin-bottom:9px">${bits}</div>`+rows+note;
     })()}
   </div></section>





   ${(m.wins||[]).length?`<section><h2>Wins</h2><div class="box">
     <ul>${m.wins.map(w=>`<li class="win">${esc(w.text)}</li>`).join('')}</ul></div></section>`:''}

   ${(m.flags||[]).length?`<section><h2>Needs attention</h2><div class="box">
     ${m.flags.map(f=>`<div class="fl fl-${f.level}">
        <b>${esc(f.head)}</b>${esc(f.text)}</div>`).join('')}</div></section>`:''}

   <section><h2>Why and goals</h2><div class="box why">
     ${(()=>{const w=m.why_strength; if(!w) return '';
       const cls={missing:'b-why-bad',thin:'b-why-bad',anchored:'b-why-ok'}[w.band]||'';
       return `<div class="meta" style="margin-bottom:8px">
         <span class="badge ${cls}">${esc(w.band)}</span>
         ${w.anchors.length?esc(w.anchors.join(', ')):'no anchor we could name back to them'}
         · <b>${w.insights}</b> transcript insight${w.insights===1?'':'s'} to mine</div>`;})()}
     ${Object.keys(m.why||{}).length?Object.entries(m.why).map(([k,v])=>
        `<p><b>${k==='underlyingMotivation'?'Why':'Goals'}.</b> ${esc(v)}</p>`).join('')
        : '<span class="pend">Not captured yet.</span>'}
   </div></section>

   ${(m.coach_context||[]).length?`<section><h2>Coaching context</h2><div class="box">
     ${m.coach_context.map(c=>`<div class="ctx">
        <span class="ic">${c.icon}</span>
        <span><span class="lb">${esc(c.label)}</span><br>${esc(c.text)}</span></div>`).join('')}
   </div></section>`:''}



   <section><h2>Upcoming</h2><div class="box">
     ${(m.upcoming||[]).length?`<ul>${m.upcoming.map(u=>
        `<li>${esc(u.date)} · ${esc(u.type)} <span class="meta">(in ${u.days} days)</span></li>`).join('')}</ul>`
       :'<span class="pend">Nothing booked.</span>'}
   </div></section>



   ${(m.admin||[]).length?`<section><h2>Admin</h2><div class="box">
     <details><summary>${m.admin.length} bookkeeping item${m.admin.length>1?'s':''}, not coaching flags</summary>
     <ul class="adm" style="margin-top:8px">${m.admin.map(a=>`<li>${esc(a.text)}</li>`).join('')}</ul>
     </details></div></section>`:''}

   ${(m.scan_history||[]).length>1?`<section><h2>Scan history</h2><div class="box">
     <ul class="tl">${m.scan_history.map(s=>`<li><span class="dt">${esc(s.date)}</span>
       <span style="flex:1">${[s.total_lb!=null?s.total_lb+' lb':null, s.lean_lb!=null?s.lean_lb+' lean':null,
         s.fat_lb!=null?s.fat_lb+' fat':null, s.bf_pct!=null?s.bf_pct+'%':null,
         s.vat_g!=null?'VAT '+s.vat_g+'g':null].filter(Boolean).join(' · ')}</span>
       </li>`).join('')}</ul></div></section>`:''}
  `;
  window.scrollTo(0,0);
}

$('#chips').innerHTML = FILTERS.map(([k,l])=>
  `<span class="chip${k==='all'?' on':''}" data-f="${k}">${l}</span>`).join('');
$('#chips').onclick = e=>{
  const c=e.target.closest('.chip'); if(!c) return;
  filter=c.dataset.f;
  document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===c));
  current=null; list();
};
$('#q').oninput = e=>{
  q=e.target.value.trim().toLowerCase();
  const hits=DATA.members.filter(matches);
  if(q && hits.length===1){ show(hits[0].slug); } else { current=null; list(); }
};
list();
</script>
